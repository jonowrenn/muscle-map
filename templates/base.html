<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Mind & Muscle{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

  <!-- jQuery (must be loaded before other scripts) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark py-1">
    <div class="container-fluid px-3">
      <div class="d-flex align-items-center">
        <a class="navbar-brand ps-2" href="{{ url_for('home') }}" style="font-size: 1.1rem;">Mind & Muscle</a>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link px-2" href="{{ url_for('muscle_map') }}" style="font-size: 0.95rem;">Muscle Map</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2" href="{{ url_for('quizgame') }}" style="font-size: 0.95rem;">Quiz Game</a>
          </li>
        </ul>
      </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link px-2" href="{{ url_for('about') }}" style="font-size: 0.95rem;">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center text-muted py-3">
    <small>&copy; 2025 MuscleMap. Built with Flask, Bootstrap, and 💪.</small>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Custom JavaScript -->
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

  <!-- Extra JavaScript -->
  {% block extra_js %}{% endblock %}

  <!-- Progress Tracker JavaScript -->
  <script src="{{ url_for('static', filename='js/progress-tracker.js') }}"></script>
</body>
</html>
